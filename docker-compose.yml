version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: dev-insecure-secret-key-change-me
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:80"
    # Uses sqlite inside the container by default -- fine for a demo/single
    # instance. For anything persistent, set DATABASE_URL to a Postgres
    # instance (see backend/.env.example) instead of relying on container
    # storage.

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000/api
    ports:
      - "80:80"
    depends_on:
      - backend

